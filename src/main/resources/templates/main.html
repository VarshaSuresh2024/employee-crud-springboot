<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Employee Management</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #1e1e2f, #2d2d44);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
    }

    .container {
        text-align: center;
        padding: 40px 60px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(12px);
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    }

    h1 {
        font-size: 35px;
        margin-bottom: 20px;
    }

    button {
        padding: 12px 30px;
        font-size: 18px;
        font-weight: bold;
        background: #6c5ce7;
        border: none;
        color: white;
        border-radius: 10px;
        cursor: pointer;
        margin: 10px;
        transition: 0.3s;
    }

    button:hover {
        background: #a29bfe;
        transform: scale(1.05);
    }

    a {
        text-decoration: none;
    }
</style>

</head>
<body>

<div class="container">
    <h1>Employee Management</h1>
    <h2 th:text="${message}"></h2>

    <a href="/add"><button>Add Employee</button></a><br>
    <a href="/view"><button>Manage Employee</button></a>
</div>

</body>
</html>
